<!doctype html>
<html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer"><title>שבוע בשכונה · הצטרפות</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#193932;color:#f8edce;font:18px/1.5 system-ui,sans-serif;min-height:100vh;display:grid;place-items:center}
main{margin:1rem;padding:2rem;max-width:28rem;border:double 5px #c1ad79}small{color:#eed29b}h1{margin:.3em 0}input,button,a{display:block;width:100%;font:inherit;border-radius:.4rem;padding:.65rem;text-align:center}
input{margin:.4rem 0 1rem;font-family:monospace;font-size:1.4rem;text-transform:uppercase}button,a{background:#ffd388;color:#203930;border:0;font-weight:bold;cursor:pointer}a[hidden]{display:none}#message{min-height:1.5rem}
</style>
<main><small>משחק המשפחה · כניסה מהטלפון</small><h1>שבוע בשכונה</h1>
<p>התחברו ל־Wi-Fi של הטלוויזיה והקלידו את <b>קוד האתר</b> שמופיע עליה.</p>
<form id="room"><label>קוד האתר<input id="code" dir="ltr" placeholder="XXXXX-XXXXX" maxlength="13" autocomplete="off" autocapitalize="characters" spellcheck="false" required></label><button>מציאת כתובת השלט</button></form>
<p id="message" role="status"></p><a hidden id="open" rel="noreferrer">פתיחת השלט ברשת הביתית</a>
<p><small>בשלט מזינים שם ואת קוד החדר בן שש הספרות. אם הדפדפן מבקש גישה לרשת המקומית, אשרו רק אם זו הרשת שלכם.</small></p></main>
<script src="join.js"></script></html>
